<template>
    <div class="monitor-root">

        <!-- Header -->
        <div class="monitor-header">
            <h1 class="monitor-title">AI Workflow Monitor</h1>
            <div class="monitor-header-actions">
                <lightning-combobox
                    label="Period"
                    value={daysBack}
                    options={periodOptions}
                    onchange={handlePeriodChange}
                    class="period-select">
                </lightning-combobox>
                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={handleRefresh}>
                </lightning-button>
            </div>
        </div>

        <!-- Metric tiles -->
        <div class="metric-grid">
            <div class="metric-tile">
                <span class="metric-value">{metrics.totalExecutions}</span>
                <span class="metric-label">Total Runs</span>
            </div>
            <div class="metric-tile metric-tile--success">
                <span class="metric-value">{metrics.successCount}</span>
                <span class="metric-label">Completed</span>
            </div>
            <div class="metric-tile metric-tile--danger">
                <span class="metric-value">{metrics.failedCount}</span>
                <span class="metric-label">Failed</span>
            </div>
            <div class="metric-tile metric-tile--info">
                <span class="metric-value">{metrics.runningCount}</span>
                <span class="metric-label">Running</span>
            </div>
            <div class="metric-tile">
                <span class="metric-value">{successRateDisplay}</span>
                <span class="metric-label">Success Rate</span>
            </div>
            <div class="metric-tile">
                <span class="metric-value">{totalTokensDisplay}</span>
                <span class="metric-label">Tokens Used</span>
            </div>
        </div>

        <!-- Recent executions table -->
        <div class="section-card">
            <div class="section-header">
                <h2 class="section-title">Recent Executions</h2>
                <lightning-spinner if:true={isLoading} size="small" alternative-text="Loading"></lightning-spinner>
            </div>

            <template if:true={hasExecutions}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped monitor-table">
                    <thead>
                        <tr>
                            <th>Workflow</th>
                            <th>Status</th>
                            <th>Started</th>
                            <th>Duration</th>
                            <th>Tokens</th>
                            <th>Retries</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={executions} for:item="ex">
                            <tr key={ex.execId}>
                                <td>{ex.workflowName}</td>
                                <td>
                                    <lightning-badge
                                        label={ex.status}
                                        class={ex.statusClass}>
                                    </lightning-badge>
                                </td>
                                <td>{ex.startedAtDisplay}</td>
                                <td>{ex.durationDisplay}</td>
                                <td>{ex.totalTokens}</td>
                                <td>{ex.retryCount}</td>
                                <td>
                                    <lightning-button-icon
                                        icon-name="utility:preview"
                                        alternative-text="View steps"
                                        size="small"
                                        data-id={ex.execId}
                                        onclick={handleViewSteps}>
                                    </lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={hasExecutions}>
                <div class="empty-state">
                    <p>No executions found for the selected period.</p>
                    <p class="empty-hint">Run a workflow from the AI Workflow Builder tab to see results here.</p>
                </div>
            </template>
        </div>

        <!-- Token usage by provider -->
        <template if:true={hasTokenData}>
            <div class="section-card">
                <h2 class="section-title">Token Usage by Provider</h2>
                <div class="token-grid">
                    <template for:each={tokenUsage} for:item="t">
                        <div key={t.providerName} class="token-tile">
                            <span class="token-provider">{t.providerName}</span>
                            <span class="token-count">{t.totalTokens}</span>
                            <span class="token-label">tokens / {t.executionCount} steps</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Step drill-down modal -->
        <template if:true={showStepModal}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title">Step Executions</h2>
                        <lightning-button-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            onclick={handleCloseModal}
                            class="slds-modal__close">
                        </lightning-button-icon>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={hasStepData}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr>
                                        <th>Step</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                        <th>Provider</th>
                                        <th>Tokens</th>
                                        <th>Duration (ms)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={stepExecutions} for:item="s">
                                        <tr key={s.stepExecId}>
                                            <td>{s.stepName}</td>
                                            <td>{s.stepType}</td>
                                            <td>{s.status}</td>
                                            <td>{s.providerUsed}</td>
                                            <td>{s.tokensUsed}</td>
                                            <td>{s.durationMs}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>
