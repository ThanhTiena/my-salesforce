<template>
    <!-- Workflow selector / header bar -->
    <lightning-card title="AI Workflow Builder" icon-name="utility:flow">
        <div slot="actions">
            <lightning-button-group>
                <lightning-button
                    label="New Workflow"
                    icon-name="utility:add"
                    onclick={handleNewWorkflow}>
                </lightning-button>
                <lightning-button
                    label="From Template"
                    icon-name="utility:layers"
                    onclick={handleShowTemplates}>
                </lightning-button>
                <lightning-combobox
                    class="workflow-selector"
                    label=""
                    value={activeWorkflowId}
                    options={workflowOptions}
                    placeholder="Open a workflow..."
                    variant="label-hidden"
                    onchange={handleWorkflowSelect}>
                </lightning-combobox>
            </lightning-button-group>
        </div>

        <!-- Three-column layout: palette | canvas | properties -->
        <div class="builder-layout">

            <!-- Left: Node Palette -->
            <c-ai-node-palette
                onnodeadd={handleNodeAdd}>
            </c-ai-node-palette>

            <!-- Centre: Canvas + Execution Panel -->
            <div class="canvas-column">
                <div
                    class="canvas-drop-zone"
                    ondragover={handleDragOver}
                    ondrop={handleDrop}>
                    <c-ai-workflow-designer
                        workflow-id={activeWorkflowId}
                        onnodeselect={handleNodeSelect}
                        onnodeunselect={handleNodeUnselect}
                        onexecutionstarted={handleExecutionStarted}>
                    </c-ai-workflow-designer>
                </div>

                <!-- Execution Progress Panel (shown after Run Now) -->
                <template if:true={activeExecutionId}>
                    <c-ai-execution-progress
                        execution-id={activeExecutionId}
                        onclose={handleExecutionPanelClose}>
                    </c-ai-execution-progress>
                </template>
            </div>

            <!-- Right: Properties Panel -->
            <c-ai-properties-panel
                selected-node={selectedNode}
                providers={providers}
                onstepupdate={handleStepUpdate}
                onstepdelete={handleStepDelete}>
            </c-ai-properties-panel>

        </div>
    </lightning-card>

    <!-- ── Template Browser Modal ── -->
    <template if:true={showTemplateModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container slds-modal__container_large">
                <header class="slds-modal__header">
                    <!-- Show back arrow when on confirm step -->
                    <template if:true={showCloneModal}>
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_back"
                            title="Back to templates"
                            onclick={handleBackToTemplates}>
                            <lightning-icon icon-name="utility:back" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">Name Your Workflow</h2>
                    </template>
                    <template if:false={showCloneModal}>
                        <h2 class="slds-modal__title">Choose a Template</h2>
                    </template>
                    <button
                        class="slds-button slds-button_icon slds-modal__close"
                        title="Close"
                        onclick={closeTemplateModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                </header>

                <!-- Step 1: Template list -->
                <template if:false={showCloneModal}>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-ai-template-browser
                            ontemplateselect={handleTemplateSelect}>
                        </c-ai-template-browser>
                    </div>
                </template>

                <!-- Step 2: Name confirmation -->
                <template if:true={showCloneModal}>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-body_small slds-m-bottom_medium clone-source-label">
                            Template: <strong>{_selectedTemplateName}</strong>
                        </p>
                        <lightning-input
                            label="Workflow Name"
                            value={cloneWorkflowName}
                            onchange={handleCloneNameChange}
                            placeholder="Enter a name for the new workflow"
                            required
                            maxlength="80">
                        </lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Back"
                            variant="neutral"
                            onclick={handleBackToTemplates}
                            disabled={isCloning}>
                        </lightning-button>
                        <lightning-button
                            label="Create Workflow"
                            variant="brand"
                            onclick={handleConfirmClone}
                            disabled={isCloneDisabled}>
                        </lightning-button>
                    </footer>
                </template>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- ── New Workflow Modal ── -->
    <template if:true={showNewModal}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 class="slds-modal__title">New Workflow</h2>
                    <button class="slds-button slds-button_icon slds-modal__close" onclick={closeNewModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                    </button>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-input
                        label="Workflow Name"
                        value={newWorkflowName}
                        onchange={handleNewNameChange}
                        required
                        maxlength="80">
                    </lightning-input>
                    <lightning-textarea
                        label="Description"
                        value={newWorkflowDesc}
                        onchange={handleNewDescChange}
                        rows="3">
                    </lightning-textarea>
                    <lightning-input
                        label="Trigger Object API Name"
                        value={newWorkflowObject}
                        placeholder="e.g. Lead, Case, Opportunity"
                        onchange={handleNewObjectChange}>
                    </lightning-input>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeNewModal}></lightning-button>
                    <lightning-button
                        label="Create"
                        variant="brand"
                        onclick={handleCreateWorkflow}
                        disabled={isCreating}>
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
