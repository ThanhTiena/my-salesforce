<template>
    <div class="template-browser">

        <!-- Loading state -->
        <template if:true={isLoading}>
            <div class="loading-container">
                <lightning-spinner alternative-text="Loading templates..." size="medium"></lightning-spinner>
            </div>
        </template>

        <!-- Empty state -->
        <template if:true={isEmpty}>
            <div class="empty-state">
                <lightning-icon icon-name="utility:layers" size="large" class="empty-icon"></lightning-icon>
                <p class="slds-text-body_regular slds-m-top_small">
                    No templates available. Create a workflow and mark it as a template.
                </p>
            </div>
        </template>

        <!-- Template cards grid -->
        <template if:true={hasTemplates}>
            <div class="template-grid">
                <template for:each={templates} for:item="tmpl">
                    <div key={tmpl.Id} class="template-card">
                        <div class="card-body">
                            <h2 class="slds-text-heading_small card-title">{tmpl.Name}</h2>
                            <p class="slds-text-body_small card-description">
                                <template if:true={tmpl.Description__c}>
                                    {tmpl.Description__c}
                                </template>
                                <template if:false={tmpl.Description__c}>
                                    <span class="no-description">No description</span>
                                </template>
                            </p>
                        </div>
                        <div class="card-footer">
                            <lightning-button
                                label="Use Template"
                                variant="brand"
                                data-id={tmpl.Id}
                                data-name={tmpl.Name}
                                onclick={handleUseTemplate}>
                            </lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </template>

    </div>
</template>
