AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: MongoDB REST proxy for Salesforce AI Orchestrator

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs20.x

Resources:
  MongoProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: sf-mongo-proxy
      Handler: handler.handler
      Environment:
        Variables:
          MONGODB_URI: !Sub '{{resolve:secretsmanager:sf-mongo-proxy/mongodb-uri}}'
          API_KEY:     !Sub '{{resolve:secretsmanager:sf-mongo-proxy/api-key}}'
      Events:
        ProxyAction:
          Type: Api
          Properties:
            Path: /action/{action}
            Method: POST
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:sf-mongo-proxy/*'

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint — set this as the Named Credential URL in Salesforce"
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
