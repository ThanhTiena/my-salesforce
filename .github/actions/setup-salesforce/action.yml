name: 'Setup Salesforce Environment'
description: 'Sets up Node.js and Salesforce CLI with multi-layer caching'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '20'
  sf-cli-version:
    description: 'Salesforce CLI version (e.g. "latest" or "2.x.x")'
    required: false
    default: 'latest'

outputs:
  cache-hit:
    description: 'Whether Salesforce CLI was restored from cache'
    value: ${{ steps.cache-sf-cli.outputs.cache-hit }}
  sf-version:
    description: 'Installed Salesforce CLI version'
    value: ${{ steps.verify.outputs.version }}

runs:
  using: 'composite'
  steps:

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    # Layer 1: npm global install dir (contains the `sf` binary)
    - name: Cache npm global packages
      id: cache-npm-global
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          /usr/local/lib/node_modules/@salesforce
          /usr/local/bin/sf
        key: npm-global-${{ runner.os }}-node${{ inputs.node-version }}-sf${{ inputs.sf-cli-version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          npm-global-${{ runner.os }}-node${{ inputs.node-version }}-sf${{ inputs.sf-cli-version }}-
          npm-global-${{ runner.os }}-node${{ inputs.node-version }}-

    # Layer 2: SF CLI config, plugins, and auth store
    - name: Cache Salesforce CLI config
      id: cache-sf-cli
      uses: actions/cache@v4
      with:
        path: |
          ~/.sf
          ~/.config/sf
          ~/.local/share/sf
        key: sf-config-${{ runner.os }}-sf${{ inputs.sf-cli-version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          sf-config-${{ runner.os }}-sf${{ inputs.sf-cli-version }}-
          sf-config-${{ runner.os }}-

    - name: Install Salesforce CLI
      if: steps.cache-npm-global.outputs.cache-hit != 'true'
      shell: bash
      run: |
        npm install -g @salesforce/cli@${{ inputs.sf-cli-version }} --loglevel=error
        echo "Installed: $(sf --version 2>&1 | head -n 1)"

    - name: Verify Salesforce CLI
      id: verify
      shell: bash
      run: |
        if ! command -v sf &> /dev/null; then
          echo "sf binary not found after setup"
          exit 1
        fi
        VERSION=$(sf --version 2>&1 | head -n 1)
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "SF CLI ready: ${VERSION}"
